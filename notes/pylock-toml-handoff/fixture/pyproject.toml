[project]
name = "plk-fixture"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
http = ["requests>=2.31"]

[dependency-groups]
lint = ["mccabe>=0.7"]
dev = ["iniconfig>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plk_fixture"]

[tool.uv]
default-groups = ["dev"]
