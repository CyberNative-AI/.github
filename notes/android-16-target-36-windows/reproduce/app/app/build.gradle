plugins { id 'com.android.application' }
android {
  namespace 'ai.cybernative.winprobe'
  compileSdk 36
  buildToolsVersion '36.0.0'
  defaultConfig { applicationId 'ai.cybernative.winprobe'; minSdk 30; versionCode 1; versionName '1' }
  flavorDimensions = ['t']
  productFlavors {
    t35 { dimension 't'; applicationIdSuffix '.t35'; targetSdk 35 }
    t36 { dimension 't'; applicationIdSuffix '.t36'; targetSdk 36 }
    t36prop { dimension 't'; applicationIdSuffix '.t36prop'; targetSdk 36 }
    t36game { dimension 't'; applicationIdSuffix '.t36game'; targetSdk 36 }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false; xmlReport true; htmlReport false; textReport true }
}
