plugins { id 'com.android.application' }
android {
  namespace 'ai.cybernative.backprobe'
  compileSdk 36
  buildToolsVersion '36.0.0'
  defaultConfig { applicationId 'ai.cybernative.backprobe'; minSdk 24; versionCode 1; versionName '1' }
  flavorDimensions = ['t']
  productFlavors {
    t35 { dimension 't'; applicationIdSuffix '.t35'; targetSdk 35 }
    t36 { dimension 't'; applicationIdSuffix '.t36'; targetSdk 36 }
    t36opt { dimension 't'; applicationIdSuffix '.t36opt'; targetSdk 36 }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false; xmlReport true; htmlReport false; textReport true }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.7.1'; implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22') }
