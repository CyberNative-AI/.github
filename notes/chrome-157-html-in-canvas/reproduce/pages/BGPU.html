const canvas = c; __watch(c);
const a = navigator.gpu ? await navigator.gpu.requestAdapter() : null; __probe.gpu_adapter = !!a;
if (a) { const device = await a.requestDevice(); const root = { device }; const ctx = c.getContext('webgpu');
  ctx.configure({ device, format: navigator.gpu.getPreferredCanvasFormat(), usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_DST });
  canvas.onpaint = () => {
    const targetTexture = ctx.getCurrentTexture();
    root.device.queue.copyElementImageToTexture(
      valueElement,
      { texture: targetTexture }
    );
  };
  canvas.requestPaint(); }
</script>
