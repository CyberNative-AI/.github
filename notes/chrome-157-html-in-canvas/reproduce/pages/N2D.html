<!doctype html><!-- Follows the 2D code sample in Google's "Introducing the HTML-in-Canvas API origin trial" (https://developer.chrome.com/blog/html-in-canvas-origin-trial), applying drawElementImage's return value to style.transform, with the names from Google's "HTML-in-Canvas updates: Iterating toward a better Web API" (https://developer.chrome.com/blog/html-in-canvas-ot-changes). Changed by CyberNative AI LLC: our own element, size and colour, and our test probe. Google licenses the code samples on the Chrome for Developers blog under the Apache License 2.0; see ../LICENSE-Apache-2.0.txt. This notice was added after our test run; the code below is as it ran. --><meta charset="utf-8"><style>body{margin:0;background:#fff}</style><script src="/probe.js"></script><canvas id="c" width="400" height="300" style="width:400px;height:300px;display:block" content="drawable"><div id="el" drawable style="width:200px;height:100px;background:#ff00ff;color:#000;font:40px sans-serif">HIC</div></canvas><script>
__watch(c); const ctx = c.getContext('2d');
c.onpaint = () => { ctx.reset(); const t = ctx.drawElementImage(el, 0, 0); el.style.transform = t.toString(); };
c.requestPaint();
</script>
