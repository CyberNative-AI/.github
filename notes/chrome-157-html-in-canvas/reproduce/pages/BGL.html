<!doctype html><!-- Adapted from the WebGL code sample in Google's "Introducing the HTML-in-Canvas API origin trial" (https://developer.chrome.com/blog/html-in-canvas-origin-trial). Changed by CyberNative AI LLC: the element's size, colour and text, a requestPaint() call, our test probe, and WebGL context setup and a draw (quad.js). Google licenses the code samples on the Chrome for Developers blog under the Apache License 2.0; see ../LICENSE-Apache-2.0.txt. This notice was added after our test run; the code below is as it ran. --><meta charset="utf-8"><style>body{margin:0;background:#fff}</style><script src="/probe.js"></script><script src="/quad.js"></script><canvas id="c" width="400" height="300" style="width:400px;height:300px;display:block" layoutsubtree><div id="form_element" style="width:200px;height:100px;background:#ff00ff;color:#000;font:40px sans-serif">HIC</div></canvas><script>
const canvas = c; __watch(c); const q = __quad(c); const gl = q.gl; const form_element = document.getElementById('form_element');
canvas.onpaint = () => {
  if (gl.texElementImage2D) {
    gl.texElementImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, form_element);
  }
  q.draw();
};
q.draw(); canvas.requestPaint();
</script>
