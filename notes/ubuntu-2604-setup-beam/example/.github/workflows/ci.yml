name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - otp: "25"
            elixir: "1.14"
            os: ubuntu-latest
          - otp: "25"
            elixir: "1.14"
            os: ubuntu-24.04
          - otp: "27"
            elixir: "1.17"
            os: ubuntu-latest
          - otp: "28"
            elixir: "1.18"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - run: mix test
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1.20.4
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - run: mix format --check-formatted
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          version-type: strict
          version-file: .tool-versions
      - run: mix release
